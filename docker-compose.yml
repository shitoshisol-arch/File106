# FILE106 ARCHIVE — single-VPS stack.
#
#   cp .env.example .env          # fill in the archive section, never commit it
#   docker compose up -d --build  # db -> migrate -> app, and Caddy gets TLS
#   docker compose logs -f app
#
# Ordering is enforced, not hoped for: `app` starts only after `migrate` has
# exited successfully, and `migrate` waits for Postgres to accept connections.
# Postgres is published on 127.0.0.1 only. It must never listen publicly.

name: file106-archive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file106}
      POSTGRES_USER: ${POSTGRES_USER:-file106}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Applies db/migrations/*.sql in order and records each one in
  # schema_migrations, so a redeploy is a no-op instead of a re-run.
  migrate:
    image: ${APP_IMAGE:-file106-archive-app}
    build: .
    command: ["node", "app/migrate.js"]
    restart: "no"
    env_file: .env
    environment:
      # The container reaches Postgres by service name, not 127.0.0.1.
      DATABASE_URL: postgres://${POSTGRES_USER:-file106}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-file106}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-file106-archive-app}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-file106}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-file106}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
