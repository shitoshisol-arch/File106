# FILE106 ARCHIVE — single-VPS stack.
#
#   node scripts/archive/init-env.mjs      # writes .env, never commit it
#   docker compose up -d --build  # db -> migrate -> app, and Caddy gets TLS
#   docker compose logs -f app
#
# Ordering is enforced, not hoped for: `app` starts only after `migrate` has
# exited successfully, and `migrate` waits for Postgres to accept connections.
# Postgres is published on 127.0.0.1 only. It must never listen publicly.

name: file106-archive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres sizes itself against the host's memory, and a free-tier box has
    # 1 GB. Left at defaults it is the first process the OOM killer picks. These
    # values keep the whole stack — Postgres, Node, Caddy — under about 700 MB,
    # which leaves room for the page cache and swap headroom on a small VM.
    # The pool in app/db.js opens at most 10 connections, plus migrations.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file106}
      POSTGRES_USER: ${POSTGRES_USER:-file106}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Applies db/migrations/*.sql in order and records each one in
  # schema_migrations, so a redeploy is a no-op instead of a re-run.
  migrate:
    image: ${APP_IMAGE:-file106-archive-app}
    build: .
    command: ["node", "app/migrate.js"]
    restart: "no"
    env_file: .env
    environment:
      # The container reaches Postgres by service name, not 127.0.0.1.
      DATABASE_URL: postgres://${POSTGRES_USER:-file106}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-file106}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-file106-archive-app}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-file106}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-file106}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      # Uploaded exhibits are part of the archive's state, so they must outlive
      # the container. Losing this volume loses every attachment row's bytes.
      - uploads_data:/app/var/uploads
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
