# FILE106 ARCHIVE — single-VPS stack.
#
# Stage 1 ships the database and the TLS terminator. The `app` service is added
# in Stage 2; until it exists the proxy answers 502, which is expected.
#
#   cp .env.example .env      # then fill in the archive section
#   docker compose up -d db
#   docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
#     -v ON_ERROR_STOP=1 < db/migrations/0001_init.sql
#
# Postgres is published on 127.0.0.1 only. It must never listen publicly.

name: file106-archive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file106}
      POSTGRES_USER: ${POSTGRES_USER:-file106}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
